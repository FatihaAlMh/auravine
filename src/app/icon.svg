    <circle cx="0" cy="0" r="2.2" fill="#fef9c3" />
    <circle cx="-13" cy="-16" r="1.1" fill="#e9d5ff" opacity="0.85" />
    <circle cx="15" cy="-12" r="1" fill="#7dd3fc" opacity="0.85" />
    <circle cx="11" cy="17" r="1.1" fill="#c084fc" opacity="0.8" />
