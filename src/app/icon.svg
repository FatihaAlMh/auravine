    <path d="M0 -22 C6 -14 6 -4 0 0 C-6 -4 -6 -14 0 -22Z" fill="url(#petal)" opacity="0.85" transform="rotate(180)" />
    <path d="M0 -22 C6 -14 6 -4 0 0 C-6 -4 -6 -14 0 -22Z" fill="url(#petal)" opacity="0.85" transform="rotate(240)" />
    <path d="M0 -22 C6 -14 6 -4 0 0 C-6 -4 -6 -14 0 -22Z" fill="url(#petal)" opacity="0.85" transform="rotate(300)" />
    <!-- Glowing stamen core & particle dust -->
