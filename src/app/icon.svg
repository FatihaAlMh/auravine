      <stop offset="0%" stop-color="#2a1659" />
      <stop offset="100%" stop-color="#070412" />
    </radialGradient>
    <linearGradient id="petal" x1="16" y1="8" x2="48" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e9d5ff" />
