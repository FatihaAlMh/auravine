<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Particle Bloom</title>
<style>
:root{--fg:#e6dcff;--bg1:#1a0f3a;--bg2:#03030c;--bg3:#000;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--fg:#e6dcff}}
:root[data-theme="dark"]{--fg:#e6dcff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:#000}
body{background:radial-gradient(ellipse at 50% 72%,var(--bg1) 0%,var(--bg2) 58%,var(--bg3) 100%);color:var(--fg);font-family:Georgia,"Times New Roman",serif}
#stage{position:fixed;inset:0}
#stage canvas{display:block;touch-action:none}
.txt{position:fixed;left:0;right:0;bottom:0;text-align:center;padding:0 24px calc(env(safe-area-inset-bottom,0px) + 7vh);pointer-events:none;font-weight:300;letter-spacing:.14em;text-shadow:0 0 18px rgba(150,120,255,.8),0 0 40px rgba(90,120,255,.5);opacity:0;transition:opacity 3s ease}
#msg{font-size:clamp(1.05rem,2.6vw,1.7rem)}
#hint{font-size:.95rem;transition:opacity 1.2s ease}
#hint.on{opacity:.75;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
#msg.show{opacity:1}
</style>
</head>
<body>
<div id="stage"></div>
<div id="hint" class="txt">Tap the glowing seed</div>
<div id="msg" class="txt"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Change this line to set the message revealed after the bloom.
const MESSAGE = "Every great bloom begins as a small, quiet seed.";

const stage = document.getElementById('stage');
const msgEl = document.getElementById('msg'), hintEl = document.getElementById('hint');
msgEl.textContent = MESSAGE;
setTimeout(() => hintEl.classList.add('on'), 400);

const PR = Math.min(window.devicePixelRatio || 1, 2);
const renderer = new THREE.WebGLRenderer({ alpha: true });
renderer.setPixelRatio(PR);
renderer.setClearColor(0x000000, 0);
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
let camZ = 14.5, W = 1, H = 1;

const timeU = { value: 0 }, scaleU = { value: 1 };
const VS = `
attribute float aSize, aAlpha, aSeed; attribute vec3 aColor;
uniform float uTime, uPR, uScale, uWobble, uFade;
varying vec3 vC; varying float vA;
void main(){
  vec3 p = position;
  p += uWobble * vec3(sin(uTime*1.3+aSeed*20.), cos(uTime*1.1+aSeed*31.), sin(uTime*0.9+aSeed*11.));
  vec4 mv = modelViewMatrix * vec4(p,1.);
  gl_Position = projectionMatrix * mv;
  gl_PointSize = min(aSize * 40. * uScale * uPR / -mv.z, 24. * uPR);
  vA = aAlpha * uFade * (0.75 + 0.25*sin(uTime*2. + aSeed*50.));
  vC = aColor;
}`;
const FS = `
varying vec3 vC; varying float vA;
void main(){
  float d = length(gl_PointCoord - 0.5);
  if(d > 0.5) discard;
  float a = pow(1.0 - d*2.0, 2.2);
  float core = smoothstep(0.22, 0.0, d);
  gl_FragColor = vec4(vC + core*0.45, a * vA);
}`;
function makeMat(fade, wobble){
  return new THREE.ShaderMaterial({
    uniforms:{uTime:timeU,uScale:scaleU,uPR:{value:PR},uFade:{value:fade},uWobble:{value:wobble}},
    vertexShader:VS, fragmentShader:FS, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending
  });
}
function makePoints(pos, size, col, alpha, seedArr, mat, dynamic){
  const g = new THREE.BufferGeometry();
  const P = new THREE.BufferAttribute(pos,3), S = new THREE.BufferAttribute(size,1);
  if(dynamic){ P.setUsage(THREE.DynamicDrawUsage); S.setUsage(THREE.DynamicDrawUsage); }
  g.setAttribute('position',P); g.setAttribute('aSize',S);
  g.setAttribute('aColor',new THREE.BufferAttribute(col,3));
  g.setAttribute('aAlpha',new THREE.BufferAttribute(alpha,1));
  g.setAttribute('aSeed',new THREE.BufferAttribute(seedArr,1));
  const pts = new THREE.Points(g, mat); pts.frustumCulled = false; return pts;
}
const R = Math.random, TAU = Math.PI*2;
const gs = () => (R()+R()+R()-1.5)/1.5;
const mix = (a,b,t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
const clamp = (x,a,b) => Math.min(b,Math.max(a,x));
const ease = x => x*x*(3-2*x);

/* ---------- Flower (lily-style, like the Rapunzel bloom) ---------- */
const THEMES = {
  violet:{base:[0.95,0.85,1.0],mid:[0.55,0.40,1.0],tip:[0.28,0.50,1.0],throat:[0.95,0.50,0.90],tend:[1.0,0.88,0.6],stem:[0.2,0.65,0.85]},
  gold:  {base:[1.0,0.92,0.7],mid:[1.0,0.62,0.2],tip:[1.0,0.78,0.45],throat:[0.8,0.3,0.7],tend:[1.0,0.85,0.4],stem:[0.2,0.75,0.4]}
};
const TH = THEMES.violet; // switch to THEMES.gold for the golden movie look
const Y0 = 3.0; // stem height
// 6 big lily petals (3 outer + 3 inner, interleaved) + a small glowing throat.
// p0/p1 = rise angle at base/tip (rad from vertical), curl = tip rolls back, w = half-width, ruf = wavy edge.
const LAYERS = [
  {n:3,yaw:0,     len:4.4,p0:0.45,p1:1.55,curl:1.0,w:1.35,ruf:1.0,share:0.38},
  {n:3,yaw:1.0472,len:4.0,p0:0.35,p1:1.25,curl:0.9,w:1.40,ruf:1.0,share:0.38},
  {n:6,yaw:0.3,   len:1.8,p0:0.10,p1:0.55,curl:0.5,w:0.50,ruf:0.3,share:0.24}
];
const N_STEM=2400, N_CORE=2400, N_PETAL=19000, N=N_STEM+N_CORE+N_PETAL;
const open=new Float32Array(N*3), closed=new Float32Array(N*3), cur=new Float32Array(N*3), vel=new Float32Array(N*3);
const size0=new Float32Array(N), size=new Float32Array(N), colA=new Float32Array(N*3), alphaA=new Float32Array(N), seedA=new Float32Array(N), appear=new Float32Array(N), type=new Uint8Array(N);
const sstep=(a,b,x)=>ease(clamp((x-a)/(b-a),0,1));

function spine(L,t,o){
  const p0=0.08+(L.p0-0.08)*o, p1=0.3+(L.p1-0.3)*o, cu=L.curl*o;
  const n=12, dt=t/n; let r=0,y=0;
  for(let k=0;k<n;k++){ const u=(k+0.5)*dt, phi=p0+(p1-p0)*u+cu*u*u*u*u; r+=Math.sin(phi)*dt*L.len; y+=Math.cos(phi)*dt*L.len; }
  return [r,y];
}
function petalPos(L, ang, t, s, o){
  const sp=spine(L,t,o);
  const w=L.w*Math.pow(Math.sin(Math.PI*Math.pow(t,0.85)),0.7);   // broad oval, pointed tip
  const rho=sp[0]+0.1+0.35*w*(1-s*s)*(1-o);                         // closed bud wraps round
  const y=sp[1]+0.3*w*s*s*o+L.ruf*0.2*Math.sin(t*10+ang*2)*s*s*o;   // cupped, wavy edges
  const lat=s*w*(0.35+0.65*o);
  const ca=Math.cos(ang), sa=Math.sin(ang);
  return [ca*rho - sa*lat, Y0+y, sa*rho + ca*lat];
}
function setP(i, o, c){ open.set(o,i*3); closed.set(c,i*3); }

// curly golden tendrils: a path whose turning angle grows, so it spirals
const TEND=[];
for(let j=0;j<5;j++){
  const K=(j%2?-1:1)*(5+R()*2.5), len=2.6+R()*0.6, path=[[0,0]]; let a=0,b=0; const n=60;
  for(let k=0;k<n;k++){ const u=(k+0.5)/n, psi=0.25+K*u*u, ds=len/n*(1.15-0.7*u); a+=Math.sin(psi)*ds; b+=Math.cos(psi)*ds; path.push([a,b]); }
  TEND.push({ang:j*1.2566+0.4,path});
}
const LEAVES=[{yb:0.25,az:0.6,len:2.4},{yb:0.45,az:3.0,len:2.8},{yb:0.8,az:4.4,len:2.0},{yb:1.15,az:1.9,len:1.7}];

for(let i=0;i<N;i++){
  seedA[i]=R(); alphaA[i]=0.6;
  if(i<800){                                   // stem
    type[i]=0;
    const yy=R()*Y0, x=0.25*Math.sin(yy/Y0*TAU);
    const p=[x+gs()*0.06, yy, gs()*0.06]; setP(i,p,p);
    colA.set(mix(TH.stem.map(v=>v*0.6),TH.stem,yy/Y0),i*3);
    size0[i]=0.6+R()*0.5; appear[i]=(yy/Y0)*1.5; alphaA[i]=0.6;
  } else if(i<N_STEM){                         // leaves
    type[i]=0;
    const lf=LEAVES[i%4];
    let t; do{ t=R(); }while(R()>Math.pow(Math.sin(Math.PI*Math.pow(t,0.8)),0.7));
    const edge=R()<0.2?1:0, s=edge?(R()<0.5?-1:1):R()*2-1;
    const w=0.8*(lf.len/2.4)*Math.sin(Math.PI*Math.pow(t,0.8)), r=lf.len*t*0.95;
    const yy=lf.yb+lf.len*(0.5*t-0.55*t*t)+0.2*w*s*s, x0=0.25*Math.sin(lf.yb/Y0*TAU);
    const dx=Math.cos(lf.az), dz=Math.sin(lf.az);
    const p=[x0+dx*r-dz*s*w, yy, dx*s*w+dz*r]; setP(i,p,p);
    colA.set(TH.stem.map(v=>v*(0.55+0.3*t)*(1+0.5*edge)),i*3);
    size0[i]=0.6+R()*0.5; appear[i]=(lf.yb/Y0)*1.5+t*0.4; alphaA[i]=0.45;
  } else if(i<N_STEM+N_CORE){                  // centre: tendrils, glow, stamens
    type[i]=1; const q=R(); let p,c,sz,ap;
    if(q<0.55){
      const T=TEND[(R()*5)|0], u=R(), f=u*60, k=Math.min(59,f|0), fr=f-k, A=T.path[k], B=T.path[k+1];
      const a=A[0]+(B[0]-A[0])*fr, b=A[1]+(B[1]-A[1])*fr, sc=R()<0.15?0.14:0.025;
      p=[Math.cos(T.ang)*a+gs()*sc, Y0+0.5+b+gs()*sc, Math.sin(T.ang)*a+gs()*sc];
      c=mix(TH.tend,[1,1,1],u*0.6); sz=0.9+R()*1.0; ap=2.0+u*1.3;
    } else if(q<0.8){
      p=[gs()*0.45,Y0+0.45+gs()*0.35,gs()*0.45]; c=mix(TH.throat,[1,1,1],R()*0.7); sz=1.0+R()*1.1; ap=1.3+R()*0.8;
    } else {
      const aa=((R()*6)|0)*1.0472+0.2, head=R()<0.3, u=head?1:R(), j=head?0.1:0.03;
      p=[Math.cos(aa)*(0.15+1.3*u)+gs()*j, Y0+0.3+0.2+1.0*u-0.35*u*u+gs()*j, Math.sin(aa)*(0.15+1.3*u)+gs()*j];
      c=head?TH.tend:mix(TH.base,TH.tend,u); sz=head?1.6:0.8; ap=1.6+R()*0.6;
    }
    setP(i,p,p); colA.set(c,i*3); size0[i]=sz; appear[i]=ap; alphaA[i]=0.9;
  } else {                                     // petals
    type[i]=2;
    let r=R(), li=0; while(li<LAYERS.length-1 && r>LAYERS[li].share){ r-=LAYERS[li].share; li++; }
    const L=LAYERS[li];
    const ang=Math.floor(R()*L.n)/L.n*TAU + L.yaw + gs()*0.02;
    let t; do{ t=R(); }while(R()>Math.pow(Math.sin(Math.PI*Math.pow(t,0.85)),0.7)); // even fill of the petal
    const kind=R(); let s=R()*2-1, edge=0;
    if(kind<0.2){ s=(R()<0.5?-1:1)*(0.94+0.06*R()); edge=1; }        // bright outline
    else if(kind<0.28){ s=gs()*0.04; edge=0.5; }                     // centre vein
    const jit=[gs()*0.04,gs()*0.04,gs()*0.04];
    const o=petalPos(L,ang,t,s,1), c=petalPos(L,ang,t,s,0);
    setP(i,[o[0]+jit[0],o[1]+jit[1],o[2]+jit[2]],[c[0]+jit[0],c[1]+jit[1],c[2]+jit[2]]);
    let col = li===2 ? mix(TH.throat,TH.base,t)
      : mix(mix(TH.base,TH.mid,sstep(0,0.4,t)),TH.tip,sstep(0.4,1,t)*(li===0?1:0.65));
    let sp=0; if(li<2 && t<0.55 && R()<0.1){ col=TH.tend; sp=1; }   // warm speckles near the throat
    const br=(0.75+0.35*R())*(1+0.45*edge+0.25*Math.abs(s));
    colA.set(col.map(v=>v*br),i*3);
    size0[i]=(0.6+R()*0.6)*(1+0.3*edge+0.8*sp); appear[i]=1.1+li*0.12+t*0.3; alphaA[i]=0.5+0.3*sp;
  }
  if(type[i]===0) cur.set([open[i*3],open[i*3+1],open[i*3+2]],i*3); else cur.set([0,Y0,0],i*3);
}
const flowerMat = makeMat(1.0, 0.025);
const flower = makePoints(cur,size,colA,alphaA,seedA,flowerMat,true);
scene.add(flower);

/* ---------- Seed ---------- */
const SEED_POS = new THREE.Vector3(0,0.16,0);
const seedMat = makeMat(1,0.02);
{
  const n=200, pos=new Float32Array(n*3), sz=new Float32Array(n), col=new Float32Array(n*3), al=new Float32Array(n), sd=new Float32Array(n);
  for(let i=0;i<n;i++){
    const halo=i>=160, rad=halo?0.25+R()*0.5:0.05+R()*0.12;
    const v=new THREE.Vector3(gs(),gs(),gs()).normalize().multiplyScalar(rad);
    pos.set([v.x,SEED_POS.y+v.y*0.8,v.z],i*3);
    col.set(halo?[0.5,0.4,1.0]:mix([1,0.9,1],[0.7,0.5,1],R()),i*3);
    sz[i]=halo?2.6:1.3+R()*0.9; al[i]=halo?0.18:0.95; sd[i]=R();
  }
  scene.add(makePoints(pos,sz,col,al,sd,seedMat,false));
}

/* ---------- Ground dust ---------- */
const dustMat=makeMat(0.6,0.12);
{
  const n=1800, pos=new Float32Array(n*3), sz=new Float32Array(n), col=new Float32Array(n*3), al=new Float32Array(n), sd=new Float32Array(n);
  for(let i=0;i<n;i++){
    const r=Math.pow(R(),0.7)*12, a=R()*TAU;
    pos.set([Math.cos(a)*r, R()<0.8?R()*0.35:R()*3.5, Math.sin(a)*r],i*3);
    col.set(mix([0.4,0.35,0.9],[0.3,0.6,1.0],R()),i*3);
    sz[i]=0.4+R()*0.7; al[i]=0.18+R()*0.25; sd[i]=R();
  }
  scene.add(makePoints(pos,sz,col,al,sd,dustMat,false));
}

/* ---------- Magic ring ---------- */
const ringGroup=new THREE.Group(); ringGroup.position.set(0,3.4,0); ringGroup.rotation.set(0.3,0,-0.25);
const ringMat=makeMat(0,0.08);
{
  const n=3000, pos=new Float32Array(n*3), sz=new Float32Array(n), col=new Float32Array(n*3), al=new Float32Array(n), sd=new Float32Array(n);
  for(let i=0;i<n;i++){
    const a=R()*TAU, r=7+gs()*0.8+0.3*Math.sin(a*5);
    pos.set([Math.cos(a)*r, gs()*0.3, Math.sin(a)*r],i*3);
    col.set(mix([0.6,0.35,1.0],[0.3,0.75,1.0],0.5+0.5*Math.sin(a*2)),i*3);
    sz[i]=R()<0.02?2.6:0.5+R()*1.0; al[i]=0.5+R()*0.4; sd[i]=R();
  }
  ringGroup.add(makePoints(pos,sz,col,al,sd,ringMat,false)); scene.add(ringGroup);
}

/* ---------- Input ---------- */
const ndc={x:0,y:0}; let pointerActive=false, started=false, t0=0, msgShown=false;
function setPointer(e){ ndc.x=(e.clientX/W)*2-1; ndc.y=-(e.clientY/H)*2+1; }
function nearSeed(e){
  const v=SEED_POS.clone().project(camera);
  const sx=(v.x*0.5+0.5)*W, sy=(-v.y*0.5+0.5)*H;
  return Math.hypot(e.clientX-sx,e.clientY-sy) < Math.max(70,0.07*Math.min(W,H));
}
const cv=renderer.domElement;
cv.addEventListener('pointermove',e=>{
  setPointer(e); pointerActive=true;
  cv.style.cursor=(!started&&nearSeed(e))?'pointer':'default';
});
cv.addEventListener('pointerdown',e=>{
  setPointer(e); pointerActive=true;
  if(!started && nearSeed(e)){ started=true; t0=timeU.value; hintEl.classList.remove('on'); hintEl.style.opacity=0; }
});
const endPtr=e=>{ if(e.pointerType!=='mouse') pointerActive=false; };
cv.addEventListener('pointerup',endPtr);
cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('pointerleave',()=>{pointerActive=false;});

function resize(){
  W=window.innerWidth; H=window.innerHeight;
  renderer.setSize(W,H);
  const aspect=W/H; camera.aspect=aspect;
  camZ=Math.max(14.5, 9.5/(0.93*aspect));
  camera.updateProjectionMatrix();
  scaleU.value=clamp(H/900,0.6,1.3)*camZ/14.5;
}
window.addEventListener('resize',resize); resize();

/* ---------- Loop ---------- */
const ro=new THREE.Vector3(), rd=new THREE.Vector3();
let last=performance.now();
const MR=2.0, MR2=MR*MR, PUSH=55;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min((now-last)/1000,0.033); last=now;
  const time=timeU.value+dt; timeU.value=time;

  camera.position.set(Math.sin(time*0.12)*1.6, 4.0, camZ);
  camera.lookAt(0,2.7,0); camera.updateMatrixWorld();

  const e=started?time-t0:-1;
  ringGroup.children[0].rotation.y+=dt*0.22;
  seedMat.uniforms.uFade.value=started?Math.max(0,1-e/1.2):0.75+0.25*Math.sin(time*2.5);
  ringMat.uniforms.uFade.value=ease(clamp((e-1.6)/2.2,0,1));
  dustMat.uniforms.uFade.value=0.6+0.4*ease(clamp((e-1.5)/2,0,1));

  if(started){
    const b=ease(clamp((e-1.9)/1.8,0,1));
    const br=1+0.02*Math.sin(time*1.3)*b;
    const k=3+7*(1-ease(clamp((e-3.5)/1.0,0,1)));
    const damp=Math.exp(-2.4*dt);
    if(pointerActive){
      ro.copy(camera.position);
      rd.set(ndc.x,ndc.y,0.5).unproject(camera).sub(ro).normalize();
    }
    for(let i=0;i<N;i++){
      const i3=i*3;
      const g=ease(clamp((e-appear[i])/0.7,0,1));
      let bx,by,bz;
      if(type[i]===0){ bx=open[i3]; by=open[i3+1]; bz=open[i3+2]; }
      else {
        const mx=(closed[i3]+(open[i3]-closed[i3])*b)*br;
        const my=closed[i3+1]+(open[i3+1]-closed[i3+1])*b;
        const mz=(closed[i3+2]+(open[i3+2]-closed[i3+2])*b)*br;
        const h=(my-Y0)*0.05*b, ph=time*1.2+(my-Y0)*0.8+open[i3]*0.6;
        bx=mx*g+h*Math.sin(ph)*g; by=Y0+(my-Y0)*g; bz=mz*g+h*Math.cos(ph*0.9)*g;
      }
      size[i]=size0[i]*g;
      const cx=cur[i3], cy=cur[i3+1], cz=cur[i3+2];
      let vx=vel[i3], vy=vel[i3+1], vz=vel[i3+2];
      if(pointerActive && g>0.05){
        const dx=cx-ro.x, dy=cy-ro.y, dz=cz-ro.z;
        const tt=dx*rd.x+dy*rd.y+dz*rd.z;
        const px=dx-rd.x*tt, py=dy-rd.y*tt, pz=dz-rd.z*tt;
        const d2=px*px+py*py+pz*pz;
        if(d2<MR2){
          const d=Math.sqrt(d2)+1e-4, f=1-d/MR, a=f*f*PUSH*dt/d;
          vx+=px*a; vy+=py*a; vz+=pz*a;
        }
      }
      vx=(vx+(bx-cx)*k*dt)*damp; vy=(vy+(by-cy)*k*dt)*damp; vz=(vz+(bz-cz)*k*dt)*damp;
      cur[i3]=cx+vx*dt; cur[i3+1]=cy+vy*dt; cur[i3+2]=cz+vz*dt;
      vel[i3]=vx; vel[i3+1]=vy; vel[i3+2]=vz;
    }
    flower.geometry.attributes.position.needsUpdate=true;
    flower.geometry.attributes.aSize.needsUpdate=true;
    if(!msgShown && e>3.9){ msgShown=true; msgEl.classList.add('show'); }
  }
  renderer.render(scene,camera);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
